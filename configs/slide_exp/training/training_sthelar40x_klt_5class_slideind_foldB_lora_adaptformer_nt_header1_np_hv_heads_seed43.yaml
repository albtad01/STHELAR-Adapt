adapters:
  adapter_type: lora_adaptformer
  decoder_train_scope: nt_header1_np_hv_heads
  lora: {rank: 8, alpha: 8, targets: [q, v], dropout: 0.0}
  adaptformer: {activation: GELU, reduction: 16}
logging:
  mode: offline
  project: sthelar40x_klt_5class_slideind
  notes: Fold B slide-independent KLT LoRA Q/V plus AdaptFormer, final NP/HV/NT heads, and pre-final NT decoder header block.
  log_comment: sthelar40x_klt_5class_slideind_foldB_lora_adaptformer_r8_a8_red16_nt_header1_np_hv_heads_e10_seed43
  tags: [sthelar, 40x, klt, slide_independent, foldB, 5class, nt_header1_peft, lora_adaptformer, nt_header1_np_hv_heads, seed43]
  wandb_dir: run/sthelar40x_klt_5class_slideind_foldB_lora_adaptformer_r8_a8_red16_nt_header1_np_hv_heads_e10_seed43/wandb
  log_dir: run/sthelar40x_klt_5class_slideind_foldB_lora_adaptformer_r8_a8_red16_nt_header1_np_hv_heads_e10_seed43/log
  level: debug
  log_images: false
random_seed: 43
gpu: 0
data:
  dataset: STHELAR
  dataset_path: "${DATA_ROOT}/sthelar40x_klt_5class_slideind_foldB_margin128"
  label_mode: 5class
  split: slide_independent
  train_folds: [train]
  val_folds: [valid]
  test_folds: [test]
  num_nuclei_classes: 6
  num_tissue_classes: 1
  input_shape: 256
  magnification: 40
model:
  backbone: SAM-H
  pretrained_encoder: null
  pretrained: models/pretrained/CellViT-SAM-H-x40.pth
  embed_dim: 1280
  input_channels: 3
  depth: 32
  num_heads: 16
  extract_layers: 4
  shared_decoders: false
training:
  batch_size: 4
  epochs: 10
  unfreeze_epoch: 999
  optimizer: AdamW
  optimizer_hyperparameter: {lr: 5.0e-05, betas: [0.85, 0.85]}
  early_stopping_patience: 10
  scheduler: {scheduler_type: exponential}
  sampling_strategy: cell
  sampling_gamma: 0.85
  mixed_precision: true
  eval_every: 1
  unfreeze_encoder: false
checkpointing:
  save_best: true
  save_last: true
  keep_last_n: 1
  save_every: 1
  delete_intermediate_checkpoints: true
adapter_export: {enabled: false}
transformations:
  randomrotate90: {p: 0.5}
  horizontalflip: {p: 0.5}
  verticalflip: {p: 0.5}
  downscale: {p: 0.5, scale: 0.2}
  blur: {p: 0.5, blur_limit: 10}
  gaussnoise: {p: 0.5, var_limit: 10}
  colorjitter: {p: 0.5, scale_setting: 0.25, scale_color: 0.1}
  superpixels: {p: 0.5}
  zoomblur: {p: 0.5}
  randomsizedcrop: {p: 0.5}
  elastictransform: {p: 0.5}
  normalize: {mean: [0.5, 0.5, 0.5], std: [0.5, 0.5, 0.5]}
eval_checkpoint: latest_checkpoint.pth
inference:
  batch_size: 16
  qc_jaccard_thresholds: [0.45, 0.60, 0.70, 0.80]
efficiency:
  enabled: true
  fold: B
  method: NT-header1 PEFT
