adapters:
  adapter_type: lora
  lora:
    rank: 8
    alpha: 8
    targets:
      - q
      - v
    dropout: 0.0

logging:
  mode: offline
  project: sthelar40x_tonsil_9class_adapters
  notes: "CellViT-SAM-H x40 with LoRA r8 alpha8 on STHELAR 40x tonsil 9-class slide-level split. Run: sthelar40x_tonsil_9class_slide_lora_r8_a8_lr5e-5_e10_seed42_CLEAN."
  log_comment: sthelar40x_tonsil_9class_slide_lora_r8_a8_lr5e-5_e10_seed42_CLEAN
  tags:
    - sthelar
    - 40x
    - tonsil
    - single_tissue
    - slide_level
    - 9class
    - pretrained
    - e10
    - lora
    - rank8
    - alpha8
    - lr5e-5
    - seed42
    - clean
  wandb_dir: run/sthelar40x_tonsil_9class_slide_lora_r8_a8_lr5e-5_e10_seed42_CLEAN/wandb
  log_dir: run/sthelar40x_tonsil_9class_slide_lora_r8_a8_lr5e-5_e10_seed42_CLEAN/log
  level: debug
  log_images: false

random_seed: 42
gpu: 0

data:
  dataset: STHELAR
  dataset_path: ${DATA_ROOT}/sthelar40x_tonsil_9class_slide
  train_folds:
    - train
  val_folds:
    - valid
  test_folds:
    - test
  num_nuclei_classes: 10
  num_tissue_classes: 1
  input_shape: 256
  magnification: 40

model:
  backbone: SAM-H
  pretrained_encoder: null
  pretrained: models/pretrained/CellViT-SAM-H-x40.pth
  embed_dim: 1280
  input_channels: 3
  depth: 32
  num_heads: 16
  extract_layers: 4
  shared_decoders: false

training:
  batch_size: 4
  epochs: 15
  unfreeze_epoch: 999
  optimizer: AdamW
  optimizer_hyperparameter:
    lr: 5.0e-05
    betas:
      - 0.85
      - 0.85
  early_stopping_patience: 10
  scheduler:
    scheduler_type: exponential
  sampling_strategy: cell
  sampling_gamma: 0.85
  mixed_precision: true
  eval_every: 1
  unfreeze_encoder: false

transformations:
  randomrotate90:
    p: 0.5
  horizontalflip:
    p: 0.5
  verticalflip:
    p: 0.5
  downscale:
    p: 0.5
    scale: 0.2
  blur:
    p: 0.5
    blur_limit: 10
  gaussnoise:
    p: 0.5
    var_limit: 10
  colorjitter:
    p: 0.5
    scale_setting: 0.25
    scale_color: 0.1
  superpixels:
    p: 0.5
  zoomblur:
    p: 0.5
  randomsizedcrop:
    p: 0.5
  elastictransform:
    p: 0.5
  normalize:
    mean:
      - 0.5
      - 0.5
      - 0.5
    std:
      - 0.5
      - 0.5
      - 0.5

eval_checkpoint: latest_checkpoint.pth